name: Docker Build & Kubernetes Deploy Check

on:
  push:
    branches: [main]
    paths:
      - "flask-calculator/**"
      - ".github/workflows/docker-k8s.yml"
  pull_request:
    branches: [main]
    paths:
      - "flask-calculator/**"
      - ".github/workflows/docker-k8s.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: flask-calc
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/flask-calc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./flask-calculator
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kind:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for kind
        uses: docker/build-push-action@v6
        with:
          context: ./flask-calculator
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flask-calc-ci

      - name: Load image into kind
        run: kind load docker-image ${{ env.IMAGE_NAME }}:latest --name flask-calc-ci

      - name: Apply Kubernetes manifests
        run: kubectl apply -f flask-calculator/k8s.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/flask-calc-deployment --timeout=120s

      - name: Verify service responds
        run: |
          kubectl port-forward svc/flask-calc-service 5000:5000 &
          PF_PID=$!
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/
          kill $PF_PID

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deployment flask-calc-deployment
          kubectl logs -l app=flask-calc --tail=200
