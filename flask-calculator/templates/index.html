<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Docker Calculator</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; display: flex; 
            justify-content: center; align-items: center; 
            height: 100vh; background-color: #f0f2f5; margin: 0; 
        }
        .calculator { 
            background: #222; padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 300px; 
        }
        .display { 
            width: 100%; height: 70px; font-size: 2.5rem; text-align: right; 
            margin-bottom: 20px; padding: 10px; box-sizing: border-box; 
            border: none; background: #222; color: white; outline: none; 
        }
        .grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; 
        }
        button { 
            padding: 20px 0; font-size: 1.5rem; border: none; border-radius: 50px; 
            cursor: pointer; background: #505050; color: white; transition: 0.1s; 
        }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .operator { background: #ff9500; font-weight: bold; }
        .clear { background: #d4d4d2; color: black; }
        .zero { grid-column: span 2; border-radius: 50px; text-align: left; padding-left: 30px; }
    </style>
</head>
<body>
    <div class="calculator">
        <form method="POST">
            <input type="text" class="display" name="expression" id="display" 
                   value="{{ result if result else '' }}" readonly>

            <div class="grid">
                <button type="button" class="clear" onclick="clearDisplay()">C</button>
                <button type="button" class="clear" onclick="appendChar('(')">(</button>
                <button type="button" class="clear" onclick="appendChar(')')">)</button>
                <button type="button" class="operator" onclick="appendChar('/')">÷</button>

                <button type="button" onclick="appendChar('7')">7</button>
                <button type="button" onclick="appendChar('8')">8</button>
                <button type="button" onclick="appendChar('9')">9</button>
                <button type="button" class="operator" onclick="appendChar('*')">×</button>

                <button type="button" onclick="appendChar('4')">4</button>
                <button type="button" onclick="appendChar('5')">5</button>
                <button type="button" onclick="appendChar('6')">6</button>
                <button type="button" class="operator" onclick="appendChar('-')">−</button>

                <button type="button" onclick="appendChar('1')">1</button>
                <button type="button" onclick="appendChar('2')">2</button>
                <button type="button" onclick="appendChar('3')">3</button>
                <button type="button" class="operator" onclick="appendChar('+')">＋</button>

                <button type="button" class="zero" onclick="appendChar('0')">0</button>
                <button type="button" onclick="appendChar('.')">.</button>
                <button type="submit" class="operator">＝</button>
            </div>
        </form>
    </div>

    <script>
        const display = document.getElementById('display');
        let justCalculated = {% if result %}true{% else %}false{% endif %};

        function appendChar(char) {
            // 計算直後に数字を押したら画面をリセットする
            if (justCalculated) {
                display.value = '';
                justCalculated = false;
            }
            display.value += char;
        }

        function clearDisplay() {
            display.value = '';
            justCalculated = false;
        }
    </script>
</body>
</html>
